name: Apply patch and build

on:
  push:
    branches: [dev]
    paths:
      - 'patches/patch.zip'
  workflow_dispatch:

concurrency:
  group: patch-build-dev
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  patch-and-build:
    # Runs only on dev and only for the repository owner
    if: github.ref == 'refs/heads/dev' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH="patches/patch.zip"

          if [ ! -f "$PATCH" ]; then
            echo "No patch file found. Building current code only."
            exit 0
          fi

          bad() { echo "::error::$1"; exit 1; }

          # Returns 0 (true) if the path is unsafe
          is_bad_path() {
            case "$1" in
              /*|*\\*|.git|.git/*|.github|.github/*|patches|patches/*) return 0 ;;
            esac
            if printf '%s' "$1" | grep -Eq '(^|/)\.\.(/|$)'; then return 0; fi
            return 1
          }

          unzip -tq "$PATCH" >/dev/null || bad "patch.zip is corrupted"

          if unzip -Z "$PATCH" | grep -Eq '^l'; then
            bad "Symlinks are not allowed in the patch"
          fi

          while IFS= read -r name; do
            if is_bad_path "$name"; then
              bad "Unsafe path in patch: $name"
            fi
          done < <(unzip -Z1 "$PATCH")

          TMP="$(mktemp -d)"
          unzip -q "$PATCH" -d "$TMP"

          # Optional deletions: one file path per line in delete.txt
          if [ -f "$TMP/delete.txt" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              [ -z "$line" ] && continue
              if is_bad_path "$line"; then
                bad "Unsafe path in delete.txt: $line"
              fi
              if [ -f "$line" ]; then
                git rm -q -- "$line"
                echo "Deleted: $line"
              else
                echo "Skipped (not a file): $line"
              fi
            done < "$TMP/delete.txt"
            rm "$TMP/delete.txt"
          fi

          # Place files at their paths inside the zip
          cp -a "$TMP"/. .

          # Remove the patch file and save everything
          git rm -q -- "$PATCH"
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "Apply patch"
          git push origin HEAD:dev

      - name: Check for Gradle project
        id: gradle
        shell: bash
        run: |
          if [ -f gradlew ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No gradlew found, build skipped"
            echo "Build SKIPPED: no gradlew in the repository yet." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up JDK 17
        if: steps.gradle.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        if: steps.gradle.outputs.found == 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: steps.gradle.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: medora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
