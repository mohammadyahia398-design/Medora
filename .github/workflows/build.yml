name: Build APK

on:
  workflow_run:
    workflows: ["Apply patch"]
    types: [completed]
  push:
    branches: [main]
    paths-ignore:
      - 'patch.zip'
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check project files
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            echo "::error::gradlew not found. The Android project is missing."
            exit 1
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle/wrapper/gradle-wrapper.jar is missing (maybe ignored by .gitignore)."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
